# Render blueprint for the Faregate gateway. See docs/DEPLOY.md.
#
# Runs on Render's free instance type: no card, no charge. A free instance
# sleeps after 15 minutes without traffic and wakes on the next request, and
# its disk is wiped on every deploy and wake, so the snapshot file is a cache
# of the queue, not a record. With ENS live the passports come from Sepolia,
# so nothing that matters is lost. To keep the queue and ledger between
# visitors, the gateway visits its own public /health every ten minutes,
# using the RENDER_EXTERNAL_URL Render sets; FAREGATE_KEEP_AWAKE_URL=off stops it.
#
# The gateway holds no private keys. Only the values marked sync: false are
# entered in the Render dashboard, and none of them is a key that can move
# funds: the agent's Hedera key and the ENS owner key stay on the operator's
# machine.
services:
  - type: web
    name: faregate-gateway
    runtime: node
    plan: free
    branch: main
    # Redeploy only when the gateway itself can have changed. Every deploy
    # restarts the process and empties its request queue and ledger, so a push
    # that only touches docs, the dashboard, the agent or the scripts leaves
    # the running gateway, and the settled fares it holds, alone.
    buildFilter:
      paths:
        - apps/api/**
        - packages/shared/**
        - package.json
        - package-lock.json
        - tsconfig.base.json
        - .node-version
        - render.yaml
    # Only the gateway and the shared package are installed; the dashboard and
    # its dependencies are not needed here. --include=dev keeps tsc available
    # for the shared build whatever NODE_ENV the host sets.
    buildCommand: npm ci --include=dev --workspace @faregate/shared --workspace @faregate/api && npm run build --workspace @faregate/shared
    startCommand: node apps/api/src/server.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Render fronts the service with a proxy; without this every caller
      # would share the proxy's address and one rate limit.
      - key: FAREGATE_TRUST_PROXY
        value: "true"
      - key: FAREGATE_REQUIRE_SIGNED_ACTIONS
        value: "true"
      - key: FAREGATE_NETWORK
        value: hedera:testnet
      - key: FAREGATE_ASSET
        value: "0.0.429274"
      # Two public Sepolia RPCs, tried in order, so one provider's outage does
      # not refuse every agent. Both were checked against the live passports.
      - key: ENS_RPC_URL
        value: https://ethereum-sepolia-rpc.publicnode.com,https://sepolia.gateway.tenderly.co
      - key: FAREGATE_PARENT_NAME
        value: agents.faregate.eth
      - key: OPENROUTER_MODEL
        value: openai/gpt-4.1-mini
      # Tighter than the local defaults: the host is public, and a demo needs
      # a few requests a minute, not sixty.
      - key: FAREGATE_RATE_LIMIT_REQUESTS_PER_MINUTE
        value: "12"
      - key: FAREGATE_RATE_LIMIT_ACTIONS_PER_MINUTE
        value: "20"
      # Hard cap on model calls an hour, whoever asks. Past it the rule-based
      # parser answers, so the OpenRouter bill has a ceiling.
      - key: FAREGATE_AI_CALLS_PER_HOUR
        value: "200"
      # Entered in the Render dashboard. The dashboard's public URL, the
      # gateway's Hedera testnet account, and two spend-limited API keys.
      #
      # FAREGATE_CORS_ORIGIN is the dashboard's production address, scheme and
      # host only, for example https://web3-faregate.vercel.app. Until it is
      # set, the hosted dashboard reports the gateway as unreachable. Separate
      # several with commas; * stands for one part of a host name, for example
      # https://web3-faregate-*-your-team.vercel.app for every deployment URL.
      - key: FAREGATE_CORS_ORIGIN
        sync: false
      - key: FAREGATE_PAY_TO
        sync: false
      - key: GRAPH_API_KEY
        sync: false
      - key: GRAPH_SUBGRAPHS
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
