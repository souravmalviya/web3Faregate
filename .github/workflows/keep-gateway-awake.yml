# Pings the hosted gateway so its free Render instance does not sleep between
# visitors. A sleeping gateway makes the next visitor wait about a minute and
# wipes its request queue. Uses GitHub's free minutes for public repositories
# and changes nothing.
#
# Render's free plan has 750 instance hours a month, enough for one service to
# run all month. If other free Render services share the workspace, disable
# this workflow from the Actions tab so they keep their hours.
#
# Set the repository variable FAREGATE_GATEWAY_URL to ping another gateway.
name: Keep the gateway awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping /health
        env:
          GATEWAY_URL: ${{ vars.FAREGATE_GATEWAY_URL || 'https://faregate-gateway.onrender.com' }}
        run: |
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 90 --output /dev/null \
              --write-out "HTTP %{http_code} in %{time_total}s\n" "$GATEWAY_URL/health"; then
              exit 0
            fi
            sleep 20
          done
          echo "::warning::$GATEWAY_URL/health did not answer after three tries"
